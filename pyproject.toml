[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-monitoring"
version = "0.1.0"
description = "Camada de sustentação e confiabilidade de um modelo de Credit Scoring: contratos de dados, detecção de drift, observabilidade e governança."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Aviso interno do MLflow (uso do SQLAlchemy), fora do nosso controle.
filterwarnings = ["ignore:The ``noload`` loader strategy is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Templates HTML/CSS embutidos: linhas longas são intencionais.
"src/credit_monitoring/contracts/report.py" = ["E501"]
"src/credit_monitoring/drift/report.py" = ["E501"]
"src/credit_monitoring/reporting.py" = ["E501"]
"src/credit_monitoring/monitoring/dashboard.py" = ["E501"]
"src/credit_monitoring/governance/report.py" = ["E501"]
