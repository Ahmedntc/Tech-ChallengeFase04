# Configuração central do projeto.
# Caminhos relativos são resolvidos a partir da raiz do repositório.

project:
  name: credit-monitoring
  random_seed: 42

dataset:
  name: Default of Credit Card Clients
  source: UCI Machine Learning Repository (id 350)
  doi: 10.24432/C55S3H
  license: CC BY 4.0
  url: https://archive.ics.uci.edu/static/public/350/default+of+credit+card+clients.zip
  raw_file: data/raw/default_of_credit_card_clients.xls
  # A planilha original tem uma linha de título antes do cabeçalho real.
  header_row: 1
  target_column: default payment next month
  expected_shape: [30000, 25]
  # SHA-256 do conteúdo tabular (CSV canônico), independente do formato do arquivo.
  content_sha256: 4edce6da569b2c30788a85fd98a9bafb1a983e8ca1a7aac875dd7ff853cbd0bb

pseudonymization:
  # A chave vem desta variável de ambiente; se ausente, de um arquivo local não versionado.
  key_env_var: PSEUDONYMIZATION_KEY
  key_file: .secrets/pseudonymization.key

split:
  # Fração separada como Pool de Produção (nunca usada no treino).
  production_fraction: 0.30
  # Dentro da Referência: fração de teste (avaliação final do modelo).
  test_size: 0.20
  # Dentro do treino: fração de validação (escolha do campeão e do limiar de decisão).
  valid_size: 0.20

paths:
  raw_dir: data/raw
  reference_file: data/reference/reference.parquet
  production_pool_file: data/production/production_pool.parquet
  incoming_dir: data/incoming
  quarantine_dir: data/quarantine
  validation_reports_dir: reports/validation
  model_file: models/credit_model.joblib
  model_metadata_file: models/model_metadata.json
  labels_dir: data/production/labels
  predictions_dir: data/production/predictions
  simulation_manifest: data/production/simulation_manifest.json
  drift_reports_dir: reports/drift
  logs_file: logs/pipeline.jsonl
  monitoring_reports_dir: reports/monitoring

contract_demo:
  # Tamanho dos lotes de demonstração (válido e corrompido).
  batch_size: 500

model:
  # Atributos fora do modelo por minimização e não discriminação (LGPD, art. 6º, III e IX).
  # Continuam no dataset apenas para auditoria de vieses (Etapa 4).
  excluded_features: [sex, marriage]
  logistic_regression:
    C: 1.0
    max_iter: 2000
  xgboost:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5

simulation:
  # Registros por lote mensal, amostrados do Pool de Produção.
  batch_size: 1400
  # Idade máxima considerada "cliente jovem" no cenário de novos perfis.
  young_age_max: 28
  # Segmento do concept drift: clientes em dia, porém muito endividados.
  concept_segment:
    max_pay_status: 0
    min_utilization: 0.6
  months:
    - month: M1
      title: Estável (controle)
      narrative: Nenhuma alteração. Serve para provar que o monitoramento não gera falso alarme.
    - month: M2
      title: Início da inflação
      narrative: As faturas sobem 10%.
      inflation: 0.10
    - month: M3
      title: Inflação persistente
      narrative: As faturas sobem 20% e os pagamentos não acompanham.
      inflation: 0.20
    - month: M4
      title: Novos perfis de clientes
      narrative: >-
        Expansão comercial: limites 20% maiores e 45% de clientes jovens no lote.
        Um parceiro envia um lote corrompido, que deve ser barrado pelo contrato.
      inflation: 0.25
      limit_expansion: 0.20
      young_share: 0.45
      partner_batch: corrompido
    - month: M5
      title: Desemprego em alta
      narrative: >-
        12% da carteira passa a atrasar e os pagamentos caem 10%.
        O arquivo de um parceiro chega vazio (transferência interrompida).
      inflation: 0.30
      limit_expansion: 0.20
      young_share: 0.45
      payment_change: -0.10
      unemployment: 0.12
      partner_batch: vazio
    - month: M6
      title: Crise
      narrative: >-
        Todos os efeitos se intensificam e clientes em dia, porém muito endividados,
        passam a inadimplir sem mudar nenhuma feature (concept drift).
      inflation: 0.40
      limit_expansion: 0.25
      young_share: 0.50
      payment_change: -0.20
      unemployment: 0.20
      concept_drift: 0.45

drift:
  # Faixas do PSI: decis do conjunto de referência.
  psi_bins: 10
  # Limites clássicos de risco de crédito: < 0,10 estável, 0,10–0,25 moderado, > 0,25 significativo.
  psi_moderate: 0.10
  psi_significant: 0.25
  # Nível de significância do KS. 0,01 (e não 0,05) controla o falso alarme com 23 testes por mês.
  ks_alpha: 0.01
  # Alerta quando esta fração das variáveis apresenta drift (qualquer severidade).
  drift_share_alert: 0.30
  # Alerta de drift nas predições (PSI do score).
  prediction_psi_alert: 0.10
  performance:
    # Quedas em relação ao teste da Referência que disparam alerta.
    auc_drop: 0.05
    recall_drop: 0.10
    # Diferença entre a inadimplência real e a média do score (descalibração).
    calibration_gap: 0.05

observability:
  # Limites operacionais: acima deles, a tarefa gera alerta de infraestrutura.
  max_task_seconds: 60
  max_memory_mb: 2048
  # Quantas execuções anteriores aparecem no histórico do dashboard.
  history_runs: 10

mlflow:
  # Banco SQLite local (não versionado) e pasta de artefatos.
  tracking_db: mlflow.db
  artifact_dir: mlruns
  training_experiment: credit-scoring-training
  monitoring_experiment: credit-scoring-monitoring
  registered_model: credit-scoring-model
